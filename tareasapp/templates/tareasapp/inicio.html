<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Mis Tareas</title>
    
</head>

<body>

<div >

    <form action="/">
        <button><b>🚪 Cerrar sesion</b></button>
    </form>

    <h1>📝 Mis Tareas</h1>

    <div>
        <form action="{% url 'crear_tarea' %}">
            <button><b>➕ Nueva tarea</b></button>
        </form>
    </div>

    {% for tarea in tareas %}

        <div >

            <h2>{{ tarea.titulo }}</h2>

            <p>
                {{ tarea.descripcion }}
            </p>

            <p>
                <strong>Estado:</strong>

                {% if tarea.completada %}
                    Completada ✅
                {% else %}
                    Pendiente ⏳
                {% endif %}
            </p>

            <table >
                <tr>
                    <td>
                        <form action="{% url 'detalle_tarea' tarea.id %}">
                            <button><b>👁️ Ver</b></button>
                        </form>
                    </td>
                    <td>
                        <form action="{% url 'editar_tarea' tarea.id %}">
                            <button><b>✏️ Editar</b></button>
                        </form>
                    </td>
                    <td>
                        <form action="{% url 'eliminar_tarea' tarea.id %}">
                            <button><b>🗑️ Eliminar</b></button>
                        </form>
                    </td>
                </tr>
            </table>

        </div>

    {% empty %}

        <p>No existen tareas registradas.</p>

    {% endfor %}

</div>

</body>
</html>
